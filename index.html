<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DungStoreGmail99</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:620px;margin:10vh auto;padding:28px}.card{background:white;border:1px solid #e3e8f0;border-radius:18px;padding:28px;box-shadow:0 12px 35px #17203312}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:15px}input{border:1px solid #cbd5e1;margin:10px 0 14px}button{border:0;background:#1f5eff;color:#fff;font-weight:700;cursor:pointer}small{color:#667085}.msg{margin-top:12px}</style></head><body><main class="wrap"><div class="card"><h1>DungStoreGmail99</h1><p>Kirim alamat Gmail Anda untuk disimpan.</p><form id="f"><label>Alamat Gmail</label><input id="email" type="email" placeholder="nama@gmail.com" required><button>Simpan Gmail</button></form><div id="msg" class="msg"></div><small>Jangan masukkan password, OTP, atau kode keamanan.</small></div></main><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='Menyimpan...';let r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});let j=await r.json();msg.textContent=j.ok?'Gmail berhasil dikirim.':j.error; if(j.ok)f.reset()};</script></body></html>
