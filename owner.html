<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner — DungStoreGmail99</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:5vh auto;padding:20px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:18px;padding:24px;box-shadow:0 12px 35px #17203312}.row{display:flex;gap:12px;justify-content:space-between;align-items:center}input,button{padding:12px;border-radius:9px}input{border:1px solid #cbd5e1}button{border:0;background:#1f5eff;color:#fff;cursor:pointer}.danger{background:#d92d20}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left}.hidden{display:none}</style></head><body><main class="wrap"><div id="login" class="card"><h1>Owner Login</h1><p>DungStoreGmail99</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Masuk</button><p id="lm"></p></div><div id="dash" class="card hidden"><div class="row"><div><h1>Owner Dashboard</h1><b>DungStoreGmail99</b><p>Total Gmail: <span id="count">0</span></p></div><div><button onclick="load()">Refresh</button> <button onclick="logout()">Keluar</button></div></div><table><thead><tr><th>Gmail</th><th>Waktu</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok){loginBox();load()}else lm.textContent=(await r.json()).error}function loginBox(){login.classList.add('hidden');dash.classList.remove('hidden')}async function load(){let r=await fetch('/api/entries');if(r.status===401)return;let j=await r.json();count.textContent=j.count;rows.innerHTML=j.entries.map(x=>`<tr><td>${esc(x.email)}</td><td>${new Date(x.created_at).toLocaleString('id-ID')}</td><td><button class="danger" onclick="del(${x.id})">Hapus</button></td></tr>`).join('')}async function del(id){await fetch('/api/entries/'+id,{method:'DELETE'});load()}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
